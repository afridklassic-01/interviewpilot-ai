<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="InterviewPilot AI — an adaptive AI interviewer that understands your learning journey, challenges your engineering decisions, and shows you what to improve.">
  <meta name="theme-color" content="#070B14">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InterviewPilot AI">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>InterviewPilot AI — Adaptive Technical Interviews</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #070B14;
      font-family: Roboto, -apple-system, 'Segoe UI', sans-serif;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,0.14), transparent 60%),
                  radial-gradient(1000px 500px at 100% 110%, rgba(59,130,246,0.08), transparent 55%),
                  #070B14;
      color: #F8FAFC;
      z-index: 10;
    }
    #boot-splash .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #8B5CF6, #4F46E5);
      box-shadow: 0 0 36px rgba(99,102,241,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'SFMono-Regular', Consolas, 'Roboto Mono', monospace;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 1px;
      color: #fff;
    }
    #boot-splash .label {
      font-size: 13px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #94A3B8;
    }
    #boot-splash .bar {
      width: 160px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    #boot-splash .bar i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366F1, #3B82F6);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(300%); }
    }
    .flt-progress {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="mark">IP</div>
    <div class="label">InterviewPilot AI</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) {
        el.style.transition = 'opacity 400ms ease';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 450);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
